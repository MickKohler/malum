<!doctype html>
<!-- Source of the app icon. Render it to a 1024 px PNG with a transparent background (icon.png next to this file), then run: npx tauri icon docs/logo/icon.png -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
.tile{position:absolute;inset:40px;border-radius:220px;
  background:radial-gradient(circle at 50% 30%, #2a2a36 0%, #15151c 70%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.glow{position:absolute;left:50%;top:50%;width:620px;height:620px;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle, rgba(139,123,255,.55) 0%, rgba(79,209,255,.18) 45%, transparent 70%)}
.orb{position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 72% 22%, #5fdcff 0%, rgba(79,209,255,0) 62%),radial-gradient(circle at 22% 85%, #9a7bff 0%, rgba(139,123,255,0) 70%),linear-gradient(135deg,#7f9bff,#7d7bff)}
.shade{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.0) 0%, rgba(0,0,0,0) 55%, rgba(10,10,30,.35) 100%)}
.hi{position:absolute;left:25%;top:21%;width:104px;height:104px;border-radius:50%;background:#fff;box-shadow:0 0 18px 4px rgba(255,255,255,.55)}
</style></head><body>
<div class="tile"></div><div class="glow"></div>
<div class="orb"><div class="shade"></div><div class="hi"></div></div>
</body></html>
